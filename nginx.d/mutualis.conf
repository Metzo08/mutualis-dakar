# ═════════════════════════════════════════════════════════════════════════════
# MUTUALIS DAKAR — SITE PRINCIPAL
# ═════════════════════════════════════════════════════════════════════════════
#
# Trois zones, trois traitements très différents. Les confondre est
# l'erreur la plus fréquente et la plus difficile à diagnostiquer en
# production, parce que tout « fonctionne » en local.
# ═════════════════════════════════════════════════════════════════════════════

# Redirection HTTP → HTTPS, SAUF pour la validation Let's Encrypt qui doit
# pouvoir répondre en HTTP sur le chemin dédié.
server {
    listen 80;
    listen [::]:80;
    server_name mutualis-dakar.sn;

    # Validation du certificat. Ce bloc doit répondre en HTTP, sinon
    # l'obtention du certificat échoue.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection permanente : le navigateur retient HTTPS et ne boucle pas à
    # chaque requête.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Redirection www → apex ──────────────────────────────────────────────────
# www → apex. Deux certificats pour un seul site, c'est une charge de
# maintenance inutile.
server {
    listen 80;
    listen [::]:80;
    server_name www.mutualis-dakar.sn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    return 301 https://mutualis-dakar.sn$request_uri;
}

# ── HTTPS : www → apex ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mutualis-dakar.sn;

    ssl_certificate     /etc/letsencrypt/live/mutualis-dakar.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mutualis-dakar.sn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_session_cache shared:SSL:10m;

    return 301 https://mutualis-dakar.sn$request_uri;
}

# ── HTTPS : site principal ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mutualis-dakar.sn;

    # ── Certificat ───────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/mutualis-dakar.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mutualis-dakar.sn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Session TLS réutilisée : sans cela, chaque requête ferait un handshake
    # complet. Sur mobile 3G, c'est un coût réel et visible.
    # NB : ssl_session_tickets est déjà posé dans options-ssl-nginx.conf ;
    # le redéclarer ici ferait échouer Nginx (« directive is duplicate »).
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HTTP/2 est activé par `http2 on` ci-dessus : le module ngx_http_v2
    # négocie ALPN automatiquement, sans directive supplémentaire.
    #
    # NOTE : `alpn_protocols` n'existe QUE dans le module `stream`. L'écrire
    # ici ferait échouer le démarrage de Nginx avec « unknown directive ».

    # HSTS : le navigateur passe automatiquement en HTTPS. À n'activer QUE
    # lorsque le certificat fonctionne de façon fiable — sinon un utilisateur
    # bloqué sur HTTP ne peut plus revenir en arrière.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Taille maximale d'un en-tête. Une description SDP complète peut dépasser
    # le défaut de 8 Ko selon le navigateur : la borne est relevée, sinon la
    # négociation échoue sur certains clients uniquement — un bug qui ne se
    # reproduit que chez une partie des utilisateurs.
    large_client_header_buffers 4 32k;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml application/manifest+json;

# ═════════════════════════════════════════════════════════════════════
    # ZONE 1 — SIGNALISATION WEBSOCKET (téléconsultation)
    # ═════════════════════════════════════════════════════════════════════
    # C'est ici que se joue la consultation. Trois réglages NON NÉGOCIABLES :
    location /ws/ {
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;

        # (1) Upgrade : transforme la requête HTTP en WebSocket. Sans cet
        #     en-tête, la connexion n'est jamais établie.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # (2) BUFFERING DÉSACTIVÉ. C'est LE réglage le plus important de tout
        #     ce fichier. Nginx met les réponses en tampon : une offre WebRTC
        #     resterait dans le tampon au lieu d'atteindre le navigateur, et la
        #     négociation ne démarerait pas. Le symptôme est IDENTIQUE à celui
        #     d'un réseau coupé, ce qui rend le diagnostic très trompeur.
        proxy_buffering off;
        proxy_cache off;

        # (3) DÉLAIS ALONGS. Une consultation dure plusieurs minutes. Avec le
        #     défaut de 60 s, Nginx fermerait la connexion en pleine séance et
        #     le praticien verrait la vidéo se figer sans explication.
        #     `proxy_send_timeout` couvre l'envoi vers le client, que
        #     `proxy_read_timeout` ne mesure pas.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # Une téléconsultation consomme une connexion longue. La limite par IP
        # doit l'autoriser explicitement, sinon un utilisateur légitime serait
        # refusé pour avoir trop d'onglets ouverts.
        limit_conn conn_zone 50;
    }

    # ═════════════════════════════════════════════════════════════════════
    # ZONE 2 — FLUX SSE (présence des praticiens)
    # ═════════════════════════════════════════════════════════════════════
    # Le endpoint de présence diffuse en continu « qui est en ligne ».
    location ~ ^/api/(presence|practitioners)/stream {
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MÊME CAUSE QUE LE WebSocket : sans `off`, Nginx attend de remplir son
        # tampon avant de transmettre. Le statut « en ligne » arriverait avec
        # plusieurs minutes de retard, et l'utilisateur croirait le praticien
        # indisponible alors qu'il est connecté.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        # Le flux ne se termine pas de lui-même : il doit tenir plus longtemps
        # que le délai par défaut. Une consultation pouvant durer 30 minutes,
        # le flux doit survivre.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Le format SSE est du texte : sans ces en-têtes, la réponse est mise
        # en tampon et l'utilisateur ne reçoit rien tant que la connexion
        # n'est pas fermée.
        add_header X-Accel-Buffering no;
        add_header Cache-Control 'no-cache, no-transform';
    }

    # ═════════════════════════════════════════════════════════════════════
    # ZONE 3 — API ET FRONTEND
    # ═════════════════════════════════════════════════════════════════════
    location / {
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;

        # Réutilisation des connexions vers le backend : sans `Connection ""`,
        # chaque requête HTTP/1.1 ouvre et ferme une connexion TCP, ce qui
        # sature les ports éphémères sous charge.
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Limites de débit. `nodelay` laisse passer immédiatement une requête
        # sous le seuil : sans lui, une rafale d'appels au chargement de page
        # serait mise en file et l'interface paraîtait lente.
        limit_req zone=api_zone burst=40 nodelay;
        limit_conn conn_zone 30;

        # Imagerie médicale : les photos de lésions peuvent être volumineuses.
        client_max_body_size 25m;

        # Une API qui met plus de 60 s à répondre est en panne, pas lente. Les
        # délais longs sont réservés au WebSocket et au SSE, zones précédentes.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}