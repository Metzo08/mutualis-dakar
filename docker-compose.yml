# ═════════════════════════════════════════════════════════════════════════════
# SENMUTUELLES — STACK DE PRODUCTION (senmutuelles.sn)
# ═════════════════════════════════════════════════════════════════════════════
#
# Démarrage :    docker compose up -d
# Journaux :     docker compose logs -f backend-1
# Arrêt propre : docker compose down          (conserve les données)
# Tout effacer : docker compose down -v       (⚠️ SUPPRIME les volumes)
#
# ─────────────────────────────────────────────────────────────────────────────
# CHOIX D'ARCHITECTURE ET LEURS RAISONS
# ─────────────────────────────────────────────────────────────────────────────
#
# * REDIS est obligatoire en multi-instance. C'est lui qui relaie la
#   signalisation WebRTC entre le praticien et l'assuré quand ils sont servis
#   par deux instances différentes. PostgreSQL LISTEN/NOTIFY ne convient pas :
#   il plafonne la taille du payload, et une description SDP avec ses
#   candidats ICE dépasse ce plafond.
#
# * COTURN n'est pas un luxe. Sans serveur TURN, la téléconsultation ne
#   fonctionne que si les deux postes arrivent à se voir en direct. En 4G ou
#   derrière un NAT strict (le cas le plus fréquent au Sénégal), ils n'y
#   arrivent pas : la vidéo reste bloquée. Le STUN seul ne suffit pas, il
#   permet de découvrir son adresse publique mais pas d'établir le tunnel.
#
# * Les instances backend sont SANS ÉTAT. Aucune donnée de session en mémoire :
#   le répartiteur peut donc arrêter n'importe laquelle, et les autres prennent
#   le relais sans interrompre une consultation.
#
# * POSTGRESQL expose max_connections = 200. Avec 3 instances à 20 connexions
#   chacune, on est à 60 : de la marge reste disponible. La règle à retenir
#   est toujours DB_POOL_MAX × nombre d'instances < max_connections.
# ─────────────────────────────────────────────────────────────────────────────

name: mutualis-dakar

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire dans backend/.env}
      POSTGRES_DB: ${DB_NAME:-mutualis}
      # Vérifie les pages à l'écriture : une corruption silencieuse coûte bien
      # plus cher à détecter qu'un démarrage un peu plus lent.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-4GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINT_WORK_MEM:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-10GB}
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers=4
      - -c
      - wal_compression=lz4
    healthcheck:
      # `pg_isready` seul renvoie OK avant que le serveur n'accepte vraiment
      # les connexions. On attend la version, servie une fois prêt.
      # Les variables lues sont celles DU CONTENEUR ($$ = littéral pour
      # compose, résolu par le shell du conteneur) : robuste même si le nom
      # de la base contient un espace — un nom non protégé était coupé en
      # deux arguments et le healthcheck échouait alors que la base était
      # parfaitement opérationnelle.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [privnet]

  # ── PgBouncer (Pooler de connexions pour 1M → 5M d'assurés) ──────────────
  # Multiplexe jusqu'à 2000 connexions clientes simultanées (scans QR,
  # requêtes des mutuelles, téléconsultation) vers 50 connexions réelles PostgreSQL.
  pgbouncer:
    image: edoburu/pgbouncer:v1.22.1
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obligatoire}
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mutualis}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 60
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks: [privnet]

  # ── MinIO (stockage objet S3 local) ──────────────────────────────────────
  # Reçoit les photos d'identité CSU, les scans d'ordonnances et les devis
  # hospitaliers. PostgreSQL ne stocke que l'URL de l'objet : à 1 million
  # d'assurés (~200-350 Go d'images), les 400 Go NVMe ne seraient pas
  # tenables si les fichiers vivaient sur le disque ou en Base64 en base.
  # Le bucket reste PRIVÉ : lecture uniquement via GET /api/documents/...
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY obligatoire (backend/.env)}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY obligatoire (backend/.env)}
    ports:
      - "127.0.0.1:9001:9001"   # Console d'admin : UNIQUEMENT en local sur le VPS (ssh -L)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [privnet]

  # Création automatique du bucket privé mutualis-csu au démarrage
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/${S3_BUCKET:-mutualis-csu} &&
      mc anonymous set none local/${S3_BUCKET:-mutualis-csu}
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    networks: [privnet]

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `--save ""` désactive la persistance : le bus ne contient que des
    # messages éphémères (présence, signalisation). Les écrire sur disque
    # coûterait des E/S sans bénéfice, et restaurer des données périmées
    # serait pire qu'un bus vide.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-512mb}
      # `allkeys-lru` convient : tout ce qu'on y met est reproductible depuis
      # PostgreSQL, rien n'est irremplaçable.
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # ⚠️ PAS de `ports:` — Redis ne doit jamais être joignable depuis
    # l'extérieur. Seul le réseau privé y accède.
    networks: [privnet]

# ── Coturn (serveur TURN) ─────────────────────────────────────────────────
  # Relève de l'infrastructure réseau. Il doit être joignable en UDP ET TCP,
  # et ses ports doivent être ouverts sur le pare-feu : c'est une condition de
  # fonctionnement de la téléconsultation, pas une optimisation.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    # --use-auth-secret : coturn vérifie les identifiants dérivés par le
    # backend via HMAC-SHA1 sur TURN_STATIC_AUTH_SECRET. C'est le schéma
    # REST standard : les navigateurs ne reçoivent jamais le secret, seulement
    # des identifiants tournés qu'ils ne peuvent pas falsifier.
    # Le secret DOIT être identique à celui du backend, sinon les clients
    # reçoivent 401 et la téléconsultation échoue en 4G sans explication.
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET:?TURN_STATIC_AUTH_SECRET est obligatoire — identique côté backend}
      - --realm=${TURN_REALM:-senmutuelles.sn}
      # Plages de relais : à autoriser dans le pare-feu, sans chevauchement
      # avec les autres ports de l'hôte.
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      # L'allocation doit couvrir une consultation entière : si un médecin est
      # en consultation, elle ne doit pas expirer sous ses pieds.
      - --no-multicast-peers
      - --no-cli
    healthcheck:
      test: ["CMD", "coturn", "-h"]
      interval: 30s
      timeout: 5s
      retries: 3
    # `network_mode: host` est incompatible avec `networks`. Coturn a besoin
    # d'un accès bas niveau pour la traversée de NAT.

  # ── Backend : une définition commune, trois instances ──────────────────────
  # `deploy.replicas` est ignoré par `docker compose up` hors mode Swarm.
  # On déclare donc trois services qui partagent l'image et la configuration,
  # et ne diffèrent que par INSTANCE_ID (utilisé dans les journaux et pour
  # diagnostiquer la répartition).
  backend: &backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mutualis-backend:latest
    restart: unless-stopped
    env_file:
      - backend/.env
    environment: &backend-env
      # Surcharges pour l'intérieur du réseau Docker : ici les services se
      # trouvent par leur NOM, pas par localhost. Sans ces lignes, l'instance
      # chercherait PostgreSQL et Redis sur elle-même et échouerait.
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
      REALTIME_DRIVER: redis
      NODE_ENV: production
      # Stockage objet (photos CSU, ordonnances, devis) : MinIO du réseau Docker.
      # En l'absence de ces variables, le repli se fait sur le disque local
      # (backend/uploads), non viable à grande échelle (voir objectStorage.js).
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-mutualis-csu}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Dérivation des identifiants TURN exposés aux navigateurs. Doit être
      # identique à celui du service coturn, sinon les clients reçoivent 401
      # et la téléconsultation échoue en 4G sans explication visible.
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:?TURN_STATIC_AUTH_SECRET est obligatoire — identique côté coturn}
      TURN_REALM: ${TURN_REALM:-senmutuelles.sn}
      TURN_PUBLIC_URL: ${TURN_PUBLIC_URL:-}
    # `depends_on` attend la SANTÉ du conteneur, pas son démarrage. La sonde
    # `health/ready` prend le relais : c'est elle qui décide si l'on peut
    # envoyer du trafic. Sans elle, le répartiteur viserait une instance dont
    # la base n'est pas prête.
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||5000)+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Laisse le temps de démarrer avant de juger : une sonde trop pressée
      # ferait redémarrer un conteneur parfaitement sain.
      start_period: 60s
    networks: [privnet]

  backend-1:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-1

  backend-2:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-2

  backend-3:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-3

  # ── Nginx : point d'entrée unique ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.d:/etc/nginx/conf.d:ro
      # Let's Encrypt pour le certificat. Le domaine doit pointer vers cette
      # machine et le port 80 être joignable pour la validation.
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks: [privnet]

  # ── Certbot : renouvellement du certificat ────────────────────────────────
  # Ne tourne pas en continu : un aller-retour suffit. La tâche est appelée
  # deux fois par jour puis ignorée si le certificat n'est pas proche de
  # l'expiration.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./nginx.d:/etc/nginx/conf.d:ro
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"

  # ── Sauvegarde automatique PostgreSQL vers MinIO (rétention 30 jours) ─────
  postgres-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD obligatoire}
      PGDATABASE: ${DB_NAME:-mutualis}
      MINIO_USER: ${S3_ACCESS_KEY:?}
      MINIO_PASS: ${S3_SECRET_KEY:?}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl &&
      curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc &&
      chmod +x /usr/local/bin/mc &&
      mc alias set local http://minio:9000 \"${MINIO_USER}\" \"${MINIO_PASS}\" &&
      mc mb --ignore-existing local/mutualis-backups &&
      mc anonymous set none local/mutualis-backups &&
      while true; do
        TS=$(date -u +%Y%m%d-%H%M%S);
        pg_dump --no-owner --no-acl | gzip -9 > \"/tmp/mutualis-${TS}.sql.gz\" &&
        mc cp \"/tmp/mutualis-${TS}.sql.gz\" \"local/mutualis-backups/postgres/mutualis-${TS}.sql.gz\" &&
        rm -f \"/tmp/mutualis-${TS}.sql.gz\" &&
        mc rm --recursive --force --older-than \"${BACKUP_RETENTION_DAYS}d\" local/mutualis-backups/postgres/ || true;
        sleep 86400;
      done
      "
    networks: [privnet]

networks:
  privnet:
    driver: bridge

volumes:
  pgdata:
  minio_data:
  certbot_conf:
  certbot_www: