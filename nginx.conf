# ── Nginx ──────────────────────────────────────────────────────────────────
# Répartiteur de charge ET terminaison TLS.
#
# Ce fichier porte l'essentiel de la configuration réseau en production. Deux
# réglages font toute la différence entre une téléconsultation qui marche et
# une téléconsultation qui reste bloquée :
#
#   1. LE BUFFERING. Nginx met en tampon les réponses par défaut. Sur un flux
#      SSE (présence des praticiens), la réponse n'arrive au navigateur qu'une
#      fois le tampon plein : le statut « en ligne » se mettrait à jour avec
#      plusieurs minutes de retard. Pour la signalisation WebSocket, le
#      buffering coupe purement et simplement la connexion.
#
#   2. LES DÉLAIS. Un WebSocket est une connexion longue par nature. Sans
#      `proxy_read_timeout` allongé, Nginx la ferme au bout de 60 s et
#      l'utilisateur voit sa consultation se figer en plein milieu.
#
# ── CHOIX DU RÉPARTITIONNEMENT ───────────────────────────────────────────────
# `least_conn` et non `round_robin` : la répartition au tour de rôle peut
# envoyer une nouvelle connexion sur une instance déjà saturée par ses
# téléconsultations en cours. `least_conn` vise l'instance la moins chargée,
# ce qui réduit nettement le temps d'attente au pic.
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;

# Chaque connexion consomme une mémoire tampon : 256 Ko × le nombre de
# connexions ouvertes. Sur une machine qui sert 5 millions d'assurés, ce
# réglage mal dimensionné devient la première cause de saturation.
events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Journalisation : on ne garde que ce qui sert au diagnostic. Le chemin
    # complet de la requête est omis : il gonfle les fichiers sans rien
    # apprendre.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time '
                      'up=$upstream_response_time id=$upstream_addr';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Compression. Les réponses déjà compressées (images, vidéos) sont
    # ignorées : les recompresser coûte du CPU sans rien gagner.
    gzip  on;
    gzip_types  text/plain text/css application/json application/javascript
                application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length  1024;

    # En-têtes de sécurité (complète ceux posés par Helmet côté API).
    add_header X-Frame-Options        SAMEORIGIN    always;
    add_header X-Content-Type-Options nosniff        always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # Résolution des instances backend. Nginx résout le nom UNE fois au
    # démarrage : si une instance est remplacée, il faut recharger Nginx ou
    # utiliser un résolveur dynamique. Le `resolver` ci-dessous gère ce cas.
    upstream backend_servers {
        least_conn;
        server backend-1:5000 max_fails=3 fail_timeout=30s;
        server backend-2:5000 max_fails=3 fail_timeout=30s;
        server backend-3:5000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # Limites de débit. À l'échelle, une limite en mémoire par instance laisse
    # passer N fois plus de requêtes que la limite annoncée : Nginx doit
    # être la PREMIÈRE barrière, Redis n'arrive qu'en second.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    include /etc/nginx/conf.d/*.conf;
}